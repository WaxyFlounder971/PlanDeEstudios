name = "worker-notificaciones-agenda"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cierre horario de semanas de competencias (scheduled() en src/index.js).
[triggers]
crons = ["0 * * * *"]

# Base D1 existente. No crear una base nueva para este binding.
[[d1_databases]]
binding = "DB_NOTIFICACIONES"
database_name = "db-notificaciones-agenda"
database_id = "1c061805-fbe9-453c-9b80-af673add4bf5"

[vars]
SOPORTE_ORIGEN = "https://wapper.pages.dev"
SOPORTE_EMAIL = "AppAcademica26@gmail.com"
SOPORTE_FROM = "Soporte App Académica <onboarding@resend.dev>"

# Límites de solicitudes por minuto; los namespaces deben existir en Cloudflare.
[[ratelimits]]
name = "COMPETENCIAS_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "ANALITICA_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
