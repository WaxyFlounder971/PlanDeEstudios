<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Analítica · App Académica</title>
<style>
  :root { --bg:#f5f6fa; --panel:#fff; --texto:#151a2b; --suave:#6b7390; --borde:#e3e6f0; --acento:#2563eb; --acento2:#7c3aed; --barra:#e8ebf5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0e17; --panel:#131a2b; --texto:#e8ecf8; --suave:#8b94b3; --borde:#222b45; --barra:#1d2640; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--texto); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:18px; }
  h1 { margin:0; font-size:1.4rem; } h2 { margin:0 0 12px; font-size:1.05rem; }
  .sub { color:var(--suave); font-size:.82rem; }
  .acciones { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button, .pill { font:inherit; cursor:pointer; border:1px solid var(--borde); background:var(--panel); color:var(--texto); border-radius:999px; padding:7px 14px; }
  button.primario { background:var(--acento); border-color:var(--acento); color:#fff; }
  .pill.activa { background:var(--acento); border-color:var(--acento); color:#fff; }
  label.chk { display:flex; gap:6px; align-items:center; font-size:.88rem; color:var(--suave); cursor:pointer; }
  .tarjetas { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--borde); border-radius:16px; padding:16px; }
  .kpi-num { font-size:1.9rem; font-weight:800; line-height:1.1; } .kpi-et { color:var(--suave); font-size:.8rem; margin-top:4px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; margin-bottom:16px; }
  .fila-barra { display:grid; grid-template-columns:130px 1fr 54px; gap:10px; align-items:center; margin:7px 0; font-size:.88rem; }
  .fila-barra .nombre { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pista { background:var(--barra); border-radius:999px; height:10px; overflow:hidden; }
  .relleno { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--acento),var(--acento2)); }
  .num { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th,td { padding:8px 10px; border-bottom:1px solid var(--borde); text-align:right; white-space:nowrap; }
  th:first-child,td:first-child { text-align:left; }
  th { color:var(--suave); font-weight:600; font-size:.78rem; }
  tfoot td { font-weight:700; border-bottom:0; }
  .vacio,.error { color:var(--suave); padding:18px; text-align:center; } .error { color:#dc2626; }
  .login { max-width:380px; margin:12vh auto; text-align:center; }
  .login p { color:var(--suave); }
  .admin-extra { margin-top:16px; } .admin-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  .admin-form label { display:grid; gap:4px; color:var(--suave); font-size:.82rem; }
  .admin-form input,.admin-form textarea,.admin-form select { width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:10px; background:var(--bg); color:var(--texto); font:inherit; }
  .admin-form .ancho { grid-column:1/-1; } .estado-aviso { display:flex; gap:12px; align-items:center; justify-content:space-between; border-top:1px solid var(--borde); padding:10px 0; }
  .aviso-preview { margin-top:12px; padding:14px; border:1px dashed var(--borde); border-radius:14px; background:var(--bg); }
  pre.analisis-ia { white-space:pre-wrap; font:inherit; margin:12px 0 0; color:var(--texto); }
</style>
</head>
<body>
<main>
  <section id="vista-login" class="card login" hidden>
    <h1>📊 Analítica</h1>
    <p>Acceso solo para administradores de App Académica.</p>
    <button class="primario" id="btn-login">Iniciar sesión con Google</button>
    <p id="msg-login" class="error" hidden></p>
  </section>

  <section id="vista-panel" hidden>
    <header>
      <div><h1>📊 Analítica de App Académica</h1><div class="sub" id="actualizado"></div></div>
      <div class="acciones">
        <label class="chk"><input type="checkbox" id="chk-equipo" checked> Incluir al equipo</label>
        <button class="primario" id="btn-refrescar">↻ Actualizar</button>
        <button id="btn-salir">Salir</button>
      </div>
    </header>
    <div id="contenido"></div>
  </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // Mismos valores públicos que usa la app (ver auth.js).
  const CLIENT_ID = "906522073616-7ofa7i3emqocojhlkh9ot9i0itljmd50.apps.googleusercontent.com";
  const WORKER = "https://worker-notificaciones-agenda.appacademica.workers.dev";
  const CLAVE_TOKEN = "analitica_token_v1";
  const SECCIONES = [["demo","Demo"],["resumen","Resumen"],["agenda","Agenda"],["horario","Horario"],["tiempo-estudio","Tiempo"],["semestres","Semestres"],["comunidad","Comunidad"],["finanzas","Finanzas"],["plan-estudios","Plan"],["asistente","Asistente"],["configuracion","Configuración"]];

  const $ = (id) => document.getElementById(id);
  let tokenClient = null, columnas = [], datos = {}, seccionActiva = null;
  let diasFlujos = 30;

  // ---------- sesión ----------
  function guardarToken(token, segundos) {
    try { sessionStorage.setItem(CLAVE_TOKEN, JSON.stringify({ token, exp: Date.now() + (segundos - 60) * 1000 })); } catch (e) {}
  }
  function leerToken() {
    try { const t = JSON.parse(sessionStorage.getItem(CLAVE_TOKEN) || "null"); return t && t.exp > Date.now() ? t.token : null; } catch (e) { return null; }
  }
  function mostrarLogin(mensaje) {
    $("vista-panel").hidden = true; $("vista-login").hidden = false;
    $("msg-login").hidden = !mensaje; $("msg-login").textContent = mensaje || "";
  }
  function iniciarSesion() {
    const esperar = setInterval(() => {
      if (!(window.google && google.accounts && google.accounts.oauth2)) return;
      clearInterval(esperar);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "openid email profile", // solo identidad: no pide acceso a Drive ni Calendar
        callback: (r) => {
          if (r.error || !r.access_token) return mostrarLogin("No se pudo iniciar sesión.");
          guardarToken(r.access_token, Number(r.expires_in) || 3600);
          cargar();
        },
      });
      tokenClient.requestAccessToken();
    }, 100);
  }
  function salir() { try { sessionStorage.removeItem(CLAVE_TOKEN); } catch (e) {} mostrarLogin(); }

  // ---------- datos ----------
  async function cargar() {
    const token = leerToken();
    if (!token) return mostrarLogin();
    $("vista-login").hidden = true; $("vista-panel").hidden = false;
    $("actualizado").textContent = "Cargando…";
    try {
      const r = await fetch(WORKER + "/analitica/panel", { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (r.status === 401) { salir(); return mostrarLogin(j.error || "Sesión vencida."); }
        $("vista-panel").hidden = true; return mostrarLogin(j.error || "Error " + r.status);
      }
      columnas = j.columnas; datos = {};
      j.filas.forEach((f) => (datos[f.seccion] = datos[f.seccion] || []).push(f));
      $("actualizado").textContent = j.usuario + " · actualizado " + new Date().toLocaleString("es-CR");
      pintar();
    } catch (e) {
      $("contenido").innerHTML = '<div class="error">No se pudo conectar con el Worker.</div>';
    }
  }

  // ---------- render ----------
  const equipo = () => $("chk-equipo").checked;
  const total = (v) => equipo() ? v.reduce((a, b) => a + b, 0) : v[0];
  const fmt = (n) => n.toLocaleString("es-CR");
  const escapar = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  async function api(ruta, opciones = {}) {
    const token = leerToken();
    const respuesta = await fetch(WORKER + ruta, { ...opciones, headers: { Authorization: "Bearer " + token, ...(opciones.body ? { "Content-Type":"application/json" } : {}), ...(opciones.headers || {}) }, cache:"no-store" });
    const json = await respuesta.json().catch(() => ({}));
    if (!respuesta.ok) throw new Error(json.error || `Error ${respuesta.status}`);
    return json;
  }
  function mostrarError(id, e) { const n = $(id); if (n) n.textContent = e.message || "No se pudo completar la solicitud."; }
  async function cargarFlujos() {
    const destino = $("flujo-datos"); if (!destino) return;
    destino.textContent = "Cargando embudos…";
    try {
      const j = await api(`/analitica/flujos?dias=${diasFlujos}`);
      const n = (v) => fmt(Number(v) || 0);
      const tasa = (p) => Number(p.iniciados) ? `${Math.round(100 * Number(p.completados || 0) / Number(p.iniciados))}%` : "—";
      destino.innerHTML = `<div class="pills">${[7,30,90].map(d=>`<button class="pill ${d===diasFlujos?"activa":""}" data-dias="${d}">${d} días</button>`).join("")}</div>
        <div class="scroll"><table><thead><tr><th>Proceso</th><th>Inicios</th><th>Terminaron</th><th>Cancelaron</th><th>Abandonaron</th><th>Errores</th><th>En curso</th><th>Éxito</th><th>Usuarios</th><th>Duración media</th></tr></thead><tbody>
        ${(j.procesos||[]).map(p=>`<tr><td>${escapar(p.proceso)}</td><td>${n(p.iniciados)}</td><td>${n(p.completados)}</td><td>${n(p.cancelados)}</td><td>${n(p.abandonados)}</td><td>${n(p.errores)}</td><td>${n(p.en_curso)}</td><td>${tasa(p)}</td><td>${n(p.usuarios)}</td><td>${p.duracion_media_ms?`${Math.round(p.duracion_media_ms/1000)} s`:"—"}</td></tr>`).join("")||'<tr><td colspan="10">Aún no hay recorridos.</td></tr>'}</tbody></table></div>
        <h2 style="margin-top:16px">Pasos con fricción</h2><div class="scroll"><table><thead><tr><th>Proceso</th><th>Paso</th><th>Evento</th><th>Registros</th><th>Recorridos</th><th>% de inicios</th></tr></thead><tbody>${(j.pasos||[]).map(p=>{const inicio=Number((j.procesos||[]).find(x=>x.proceso===p.proceso)?.iniciados)||0;const flujos=Number(p.flujos)||0;return `<tr><td>${escapar(p.proceso)}</td><td>${escapar(p.paso)}</td><td>${escapar(p.tipo)}</td><td>${n(p.cantidad)}</td><td>${n(flujos)}</td><td>${inicio?`${Math.round(100*flujos/inicio)}%`:"—"}</td></tr>`}).join("")||'<tr><td colspan="6">Aún no hay pasos.</td></tr>'}</tbody></table></div>`;
      destino.querySelectorAll("[data-dias]").forEach(b=>b.onclick=()=>{diasFlujos=Number(b.dataset.dias);cargarFlujos();});
    } catch(e) { destino.textContent = e.message; }
  }
  async function cargarAvisos() {
    const destino = $("avisos-lista"); if (!destino) return;
    try {
      const j = await api("/avisos/admin");
      destino.replaceChildren();
      if (!(j.avisos||[]).length) { destino.textContent = "No hay avisos todavía."; return; }
      j.avisos.forEach(a=>{
        const fila=document.createElement("div"); fila.className="estado-aviso";
        const info=document.createElement("div"); info.innerHTML=`<strong>${escapar(a.titulo)}</strong><div class="sub">${new Date(Number(a.inicia_en)).toLocaleString()} · hasta ${new Date(Number(a.termina_en)).toLocaleString()} · ${a.max_vistas} vistas · ${a.activo?"Activo":"Pausado"}</div>`;
        fila.append(info);
        if (a.activo) { const b=document.createElement("button"); b.textContent="Desactivar"; b.onclick=async()=>{try{await api("/avisos/admin/"+encodeURIComponent(a.id),{method:"DELETE"});cargarAvisos();}catch(e){mostrarError("aviso-error",e);}}; fila.append(b); }
        destino.append(fila);
      });
    } catch(e) { mostrarError("aviso-error",e); }
  }
  function montarAdminAvanzado() {
    const destino=$("contenido");
    destino.insertAdjacentHTML("beforeend", `<section class="card admin-extra"><h2>Recorridos de uso</h2><div class="sub">Inicios, cierres, abandonos y duración. Los abandonos se detectan tras 30 minutos sin actividad.</div><div id="flujo-datos" style="margin-top:12px">Cargando…</div></section>
      <section class="card admin-extra"><h2>Análisis con IA</h2><p class="sub">Claude es el proveedor preferido; OpenAI funciona como respaldo. Solo se envían métricas agregadas.</p><div class="acciones"><button id="btn-analizar-ia" class="primario">Generar análisis</button><span id="ia-error" class="error"></span></div><pre id="ia-resultado" class="analisis-ia"></pre></section>
      <section class="card admin-extra"><h2>Avisos generales</h2><p class="sub">Se muestran dentro del periodo programado al abrir la app o mientras está activa y conectada. El título y el mensaje se muestran tal como los escribes; si necesitas varios idiomas, incluye cada versión en el texto.</p><div class="admin-form">
        <label>Título<input id="aviso-titulo" maxlength="100"></label><label>Acción<select id="aviso-accion"><option value="entendido">Entendido</option><option value="aceptar">Aceptar</option><option value="continuar">Continuar</option><option value="cerrar">Cerrar</option></select></label>
        <label>Destino de Continuar<select id="aviso-destino"><option value="resumen">Resumen</option><option value="agenda">Agenda</option><option value="plan-estudios">Plan de estudios</option><option value="finanzas">Finanzas</option><option value="notas">Notas rápidas</option><option value="configuracion">Configuración</option></select></label>
        <label>Veces que se mostrará<input id="aviso-vistas" type="number" min="1" max="20" value="1"></label><label>Desde<input id="aviso-inicia" type="datetime-local"></label><label>Hasta<input id="aviso-termina" type="datetime-local"></label>
        <label class="ancho">Mensaje<textarea id="aviso-cuerpo" rows="4" maxlength="3000"></textarea></label></div>
        <div class="aviso-preview"><div class="sub">Vista previa</div><strong id="aviso-preview-titulo">Título del aviso</strong><p id="aviso-preview-cuerpo" style="white-space:pre-wrap;margin:8px 0 12px">El mensaje aparecerá aquí.</p><button id="aviso-preview-accion" class="primario" type="button" disabled>Entendido</button></div>
        <div class="acciones" style="margin:12px 0"><button id="btn-plantilla-aviso">Usar plantilla de actualización</button><button id="btn-crear-aviso" class="primario">Programar aviso</button><span id="aviso-error" class="error"></span></div><div id="avisos-lista"></div></section>`);
    const ahora=new Date(), despues=new Date(Date.now()+7*86400000);
    const local=(d)=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
    $("aviso-inicia").value=local(ahora); $("aviso-termina").value=local(despues);
    const actualizarPreview=()=>{ $("aviso-preview-titulo").textContent=$("aviso-titulo").value.trim()||"Título del aviso"; $("aviso-preview-cuerpo").textContent=$("aviso-cuerpo").value.trim()||"El mensaje aparecerá aquí."; $("aviso-preview-accion").textContent={entendido:"Entendido",aceptar:"Aceptar",continuar:"Continuar",cerrar:"Cerrar"}[$("aviso-accion").value]; };
    $("aviso-titulo").oninput=actualizarPreview; $("aviso-cuerpo").oninput=actualizarPreview; $("aviso-accion").onchange=()=>{$("aviso-destino").disabled=$("aviso-accion").value!=="continuar";actualizarPreview();}; actualizarPreview();
    $("btn-plantilla-aviso").onclick=()=>{$("aviso-titulo").value="Novedades de App Académica";$("aviso-cuerpo").value="¡Hay novedades!\n\n• [Qué cambió]\n• [Qué mejora para ti]\n\nPuedes ver los detalles en [sección].";actualizarPreview();};
    $("btn-analizar-ia").onclick=async()=>{ $("ia-error").textContent="";$("ia-resultado").textContent="Analizando…";try{const j=await api("/analitica/ia",{method:"POST",body:JSON.stringify({dias:diasFlujos})});$("ia-resultado").textContent=`Análisis ${j.proveedor} · ${j.dias} días\n\n${j.analisis}`;}catch(e){$("ia-resultado").textContent="";mostrarError("ia-error",e);} };
    $("btn-crear-aviso").onclick=async()=>{ $("aviso-error").textContent="";try{const accion=$("aviso-accion").value;await api("/avisos/admin",{method:"POST",body:JSON.stringify({titulo:$("aviso-titulo").value,cuerpo:$("aviso-cuerpo").value,inicia_en:new Date($("aviso-inicia").value).getTime(),termina_en:new Date($("aviso-termina").value).getTime(),max_vistas:Number($("aviso-vistas").value),accion,destino:$("aviso-destino").value})});$("aviso-titulo").value="";$("aviso-cuerpo").value="";cargarAvisos();}catch(e){mostrarError("aviso-error",e);} };
    cargarFlujos(); cargarAvisos();
  }
  const barras = (items) => { const max = Math.max(1, ...items.map((i) => i.valor));
    return items.map((i) => `<div class="fila-barra"><span class="nombre" title="${i.nombre}">${i.nombre}</span><div class="pista"><div class="relleno" style="width:${i.valor / max * 100}%"></div></div><span class="num">${fmt(i.valor)}</span></div>`).join("") || '<div class="vacio">Sin datos todavía.</div>'; };

  function pintar() {
    const porSeccion = SECCIONES.map(([id, nombre]) => ({ id, nombre, valor: (datos[id] || []).reduce((s, f) => s + total(f.valores), 0) }));
    const global = {};
    Object.values(datos).flat().forEach((f) => (global[f.funcion] = (global[f.funcion] || 0) + total(f.valores)));
    const funciones = Object.entries(global).map(([nombre, valor]) => ({ nombre, valor })).sort((a, b) => b.valor - a.valor);
    const orden = [...porSeccion].sort((a, b) => b.valor - a.valor);
    const totalGeneral = porSeccion.reduce((s, x) => s + x.valor, 0);
    const demo = (datos.demo || []).filter((f) => f.funcion === "Apertura").reduce((s, f) => s + total(f.valores), 0);
    // Por persona: columnas 1..11 (la 0 es el público general).
    const personas = columnas.map((nombre, i) => ({ nombre: i === 0 ? "Público general" : nombre, valor: Object.values(datos).flat().reduce((s, f) => s + f.valores[i], 0) }))
      .filter((p, i) => i === 0 || p.valor > 0);
    if (!seccionActiva) seccionActiva = (orden[0] || porSeccion[0]).id;

    $("contenido").innerHTML = `
      <div class="tarjetas">
        <div class="card"><div class="kpi-num">${fmt(totalGeneral)}</div><div class="kpi-et">Interacciones registradas</div></div>
        <div class="card"><div class="kpi-num">${orden[0].valor ? orden[0].nombre : "—"}</div><div class="kpi-et">Sección más usada</div></div>
        <div class="card"><div class="kpi-num">${funciones[0] && funciones[0].valor ? funciones[0].nombre : "—"}</div><div class="kpi-et">Acción más frecuente</div></div>
        <div class="card"><div class="kpi-num">${fmt(demo)}</div><div class="kpi-et">Aperturas de la demo</div></div>
      </div>
      <div class="grid2">
        <div class="card"><h2>Uso por sección</h2>${barras(orden.map((s) => ({ nombre: s.nombre, valor: s.valor })))}</div>
        <div class="card"><h2>Acciones más frecuentes</h2>${barras(funciones.slice(0, 10))}</div>
      </div>
      <div class="card" style="margin-bottom:16px"><h2>Por persona</h2>${barras(personas.sort((a, b) => b.valor - a.valor))}
        <div class="sub" style="margin-top:8px">Si alguien del equipo no aparece, no ha usado la app o su correo no coincide con el configurado en el Worker.</div></div>
      <div class="card"><h2>Detalle por sección</h2>
        <div class="pills">${SECCIONES.map(([id, n]) => `<button class="pill ${id === seccionActiva ? "activa" : ""}" data-sec="${id}">${n}</button>`).join("")}</div>
        <div class="scroll">${tabla(seccionActiva)}</div></div>`;
    document.querySelectorAll("[data-sec]").forEach((b) => b.onclick = () => { seccionActiva = b.dataset.sec; pintar(); });
    montarAdminAvanzado();
  }

  function tabla(id) {
    const filas = datos[id] || [];
    if (!filas.length) return '<div class="vacio">Esta sección todavía no tiene registros.</div>';
    const idx = [0];
    if (equipo()) columnas.forEach((_, i) => { if (i > 0 && filas.some((f) => f.valores[i] > 0)) idx.push(i); });
    const ord = [...filas].sort((a, b) => total(b.valores) - total(a.valores));
    const sumas = idx.map((i) => ord.reduce((s, f) => s + f.valores[i], 0));
    return `<table><thead><tr><th>Acción</th>${idx.map((i) => `<th>${i === 0 ? "General" : columnas[i]}</th>`).join("")}<th>Total</th></tr></thead>
      <tbody>${ord.map((f) => `<tr><td>${f.funcion}</td>${idx.map((i) => `<td>${fmt(f.valores[i])}</td>`).join("")}<td><strong>${fmt(idx.reduce((s, i) => s + f.valores[i], 0))}</strong></td></tr>`).join("")}</tbody>
      <tfoot><tr><td>Total</td>${sumas.map((s) => `<td>${fmt(s)}</td>`).join("")}<td>${fmt(sumas.reduce((a, b) => a + b, 0))}</td></tr></tfoot></table>`;
  }

  $("btn-login").onclick = iniciarSesion;
  $("btn-salir").onclick = salir;
  $("btn-refrescar").onclick = cargar;
  $("chk-equipo").onchange = () => Object.keys(datos).length && pintar();
  leerToken() ? cargar() : mostrarLogin();
</script>
</body>
</html>
